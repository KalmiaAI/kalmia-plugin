name: Sync setup skill

# The kalmia-setup skill is generated by www.kalmia.dev. This keeps the copy
# in this repo identical to the one the site serves.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-skill
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh the skill from the site
        id: sync
        run: echo "result=$(python .github/scripts/sync-skill.py)" >> "$GITHUB_OUTPUT"
      - name: Commit the change
        if: steps.sync.outputs.result == 'changed'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills .claude-plugin/plugin.json .cursor-plugin/plugin.json
          git commit -m "Sync the kalmia-setup skill from www.kalmia.dev"
          git push
